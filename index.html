<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puz</title>
<meta name="description" content="Puz : collection de puzzles, chronos, classements, échanges entre amis et concours.">
<meta property="og:title" content="Puz 🧩">
<meta property="og:description" content="Collection, chronos, classements, échanges entre amis et concours.">
<meta property="og:site_name" content="Puz">
<meta name="apple-itunes-app" content="app-id=6824273629">
<style>
  :root { --blue: #4C6EF5; --ink: #111; --muted: #555; --bg: #F4F5F7; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #F1F3F5; --muted: #ADB5BD; --bg: #15171C; --card: #1F2229; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: var(--bg); color: var(--ink); font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center;
         box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  .logo { width: 84px; height: 84px; border-radius: 20px; background: var(--blue); color: #fff; font-size: 44px;
          display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 8px; }
  #detail { display: none; font-weight: 700; color: var(--blue); margin: 0 0 8px; font-size: 18px; letter-spacing: 1px; }
  #sub { color: var(--muted); margin: 0 0 24px; line-height: 1.45; }
  #redirect { display: none; color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .btn { display: block; text-decoration: none; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .store { background: var(--blue); color: #fff; }
  #open { color: var(--blue); background: transparent; border: 1.5px solid var(--blue); }
</style>
</head>
<body data-noredirect="1">
<main>
  <div class="logo" aria-hidden="true">🧩</div>
  <h1 id="title">Puz</h1>
  <p id="detail"></p>
  <p id="sub"></p>
  <p id="redirect"></p>
  <div id="stores">
    <a class="btn store" id="ios" href="https://apps.apple.com/app/id6824273629">App Store</a>
    <a class="btn store" id="android" href="https://play.google.com/store/apps/details?id=com.puzapp.puz">Google Play</a>
  </div>
  <a class="btn" id="open" href="puzapp://get">Puz</a>
</main>
<script src="/redirect.js"></script>
</body>
</html>
